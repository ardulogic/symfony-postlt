server {
    listen 80;
    server_name _;
    root /app/public;                # ← matches web service volume mount
    index index.php;

    # Front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only pass the front controller to PHP-FPM
    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass api:9000;       # ← service name:port
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location /ready {
      allow 10.0.0.0/8;  # VPC/LB ranges
      deny all;
      try_files $uri /index.php$is_args$args;
    }    

    # Deny direct PHP file execution (security)
    location ~ \.php$ { return 404; }

    client_max_body_size 20m;
    sendfile off;
}

